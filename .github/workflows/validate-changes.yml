name: Validate changes.json

on:
  push:
    paths:
      - 'changes.json'
      - 'changes.schema.json'
      - 'scripts/validate-changes.js'
      - '.github/workflows/validate-changes.yml'
  pull_request:
    paths:
      - 'changes.json'
      - 'changes.schema.json'
      - 'scripts/validate-changes.js'
      - '.github/workflows/validate-changes.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate changes.json against schema
        run: npm run validate
